name: Deploy Supabase environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used for approval and secrets
        required: true
        type: string
      project_ref:
        description: Supabase project reference for this environment
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        description: Supabase personal access token used by the CLI
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations, config and Edge Functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push hosted Auth and project configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
