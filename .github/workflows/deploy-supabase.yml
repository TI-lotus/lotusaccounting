name: Deploy Supabase environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used for approval and secrets
        required: true
        type: string
      project_ref:
        description: Supabase project reference for this environment
        required: true
        type: string
    secrets:
      SUPABASE_ACCESS_TOKEN:
        description: Supabase personal access token used by the CLI
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations, config and Edge Functions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN as a GitHub repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Configure SUPABASE_DB_PASSWORD in the '${{ inputs.environment }}' GitHub environment."
            exit 1
          fi

      - name: Validate Edge Function runtime secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          required_secrets=(
            APP_ORIGIN
            ASAAS_BASE_URL
            ASAAS_API_KEY
            ASAAS_WEBHOOK_TOKEN
            LOTUS_CREDENTIAL_ENCRYPTION_KEY
            LOTUS_SCHEDULER_KEY
            RESEND_API_KEY
            RESEND_FROM_EMAIL
          )
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output-format json 2>/dev/null \
            | node scripts/validate-supabase-secrets.mjs "${required_secrets[@]}"

      - name: Link Supabase database using the environment connection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Push hosted Auth and project configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            cp supabase/config.production.toml supabase/config.toml
          fi
          supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
